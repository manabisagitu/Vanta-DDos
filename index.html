<!-- language: HTML, file: public/index.html -->
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vanta — Access</title>
<style>
  :root{
    --bg:#0a0a0c; --panel:#111114; --line:#1e1e23;
    --txt:#e8e8ea; --dim:#6b6b74; --accent:#4f8cff; --ok:#2ecc71; --bad:#ff4d5e;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:
      radial-gradient(1200px 600px at 50% -10%, #14141a 0%, transparent 60%),
      var(--bg);
    color:var(--txt);
    font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;padding:24px;
  }
  .card{
    width:100%;max-width:400px;background:var(--panel);
    border:1px solid var(--line);border-radius:16px;
    padding:36px 32px 32px;
    box-shadow:0 30px 80px -20px rgba(0,0,0,.8), 0 0 0 1px rgba(255,255,255,.02) inset;
  }
  .logo{
    width:56px;height:56px;aspect-ratio:1/1;margin:0 auto 20px;
    display:flex;align-items:center;justify-content:center;
    border-radius:14px;
    background:linear-gradient(145deg,#1a1a20,#0d0d10);
    border:1px solid var(--line);
    box-shadow:0 0 24px -6px var(--accent);
  }
  .logo svg{width:30px;height:30px;color:var(--accent)}
  h1{font-size:19px;font-weight:600;text-align:center;letter-spacing:.2px}
  .sub{font-size:12.5px;color:var(--dim);text-align:center;margin-top:6px;margin-bottom:26px}
  .tabs{display:flex;gap:6px;background:#0c0c0f;border:1px solid var(--line);border-radius:10px;padding:4px;margin-bottom:22px}
  .tabs button{
    flex:1;padding:9px;border:0;border-radius:7px;background:transparent;
    color:var(--dim);font-size:13px;font-weight:500;cursor:pointer;transition:.18s;
    font-family:inherit;
  }
  .tabs button.active{background:#1a1a20;color:var(--txt)}
  .field{position:relative;margin-bottom:14px}
  .field svg{
    position:absolute;left:13px;top:50%;transform:translateY(-50%);
    width:16px;height:16px;color:var(--dim);pointer-events:none;
  }
  .field input{
    width:100%;padding:12px 14px 12px 40px;
    background:#0c0c0f;border:1px solid var(--line);border-radius:9px;
    color:var(--txt);font-size:14px;font-family:inherit;outline:none;transition:.18s;
  }
  .field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,140,255,.12)}
  .field input::placeholder{color:#4a4a52}
  .row{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--dim);margin:4px 0 22px}
  .row label{display:flex;gap:7px;align-items:center;cursor:pointer}
  .row a{color:var(--accent);text-decoration:none}
  .btn{
    width:100%;padding:12px;border:0;border-radius:9px;cursor:pointer;
    background:var(--accent);color:#fff;font-size:14px;font-weight:600;
    font-family:inherit;transition:.18s;
  }
  .btn:hover{filter:brightness(1.12)}
  .btn:active{transform:translateY(1px)}
  .msg{font-size:12.5px;text-align:center;margin-top:14px;min-height:16px}
  .msg.ok{color:var(--ok)} .msg.bad{color:var(--bad)}
  .hide{display:none}
  .foot{text-align:center;font-size:11px;color:#3a3a42;margin-top:22px}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2 L20 6 V12 C20 17 16 20.5 12 22 C8 20.5 4 17 4 12 V6 Z"/>
      <path d="M12 7 L14.5 11.5 H11 L13 16"/>
    </svg>
  </div>
  <h1 id="title">Masuk</h1>
  <p class="sub" id="subtitle">Akses panel terkontrol</p>

  <div class="tabs">
    <button id="tabLogin" class="active" onclick="switchTab('login')">Login</button>
    <button id="tabReg" onclick="switchTab('reg')">Daftar</button>
  </div>

  <form id="form" onsubmit="return submitForm(event)">
    <div class="field">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
      </svg>
      <input id="user" type="text" placeholder="Username" autocomplete="username" required>
    </div>
    <div class="field">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
      <input id="pass" type="password" placeholder="Password" autocomplete="current-password" required>
    </div>
    <div class="field hide" id="confirmWrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
      <input id="pass2" type="password" placeholder="Konfirmasi password">
    </div>

    <div class="row" id="rowExtra">
      <label><input type="checkbox"> Ingat saya</label>
      <a href="#">Lupa password?</a>
    </div>

    <button class="btn" id="submitBtn" type="submit">Masuk</button>
    <div class="msg" id="msg"></div>
  </form>

  <div class="foot">vanta · controlled access</div>
</div>

<script>
// *auth client-side — cukup buat demo/personal, JANGAN buat multi-user nyata*
// users disimpan di localStorage browser, tidak sinkron antar device
let mode = 'login';

function switchTab(m){
  mode = m;
  const login = m === 'login';
  tabLogin.classList.toggle('active', login);
  tabReg.classList.toggle('active', !login);
  title.textContent = login ? 'Masuk' : 'Buat akun';
  subtitle.textContent = login ? 'Akses panel terkontrol' : 'Registrasi operator baru';
  submitBtn.textContent = login ? 'Masuk' : 'Daftar';
  confirmWrap.classList.toggle('hide', login);
  rowExtra.classList.toggle('hide', !login);
  msg.textContent = '';
}

function getUsers(){
  try { return JSON.parse(localStorage.getItem('vanta_users') || '{}'); }
  catch { return {}; }
}
function setUsers(u){ localStorage.setItem('vanta_users', JSON.stringify(u)); }

async function hashPass(s){
  // *SHA-256 via WebCrypto — bukan plain base64 lagi*
  const buf = new TextEncoder().encode(s);
  const h = await crypto.subtle.digest('SHA-256', buf);
  return Array.from(new Uint8Array(h)).map(b => b.toString(16).padStart(2,'0')).join('');
}

function setMsg(t, c){ msg.textContent = t; msg.className = 'msg ' + c; }

async function submitForm(e){
  e.preventDefault();
  const u = user.value.trim(), p = pass.value;

  if (u.length < 3){ setMsg('Username minimal 3 karakter','bad'); return false; }
  if (p.length < 6){ setMsg('Password minimal 6 karakter','bad'); return false; }

  const users = getUsers();
  const h = await hashPass(p);

  if (mode === 'reg'){
    if (p !== pass2.value){ setMsg('Konfirmasi password tidak cocok','bad'); return false; }
    if (users[u]){ setMsg('Username sudah dipakai','bad'); return false; }
    users[u] = h;
    setUsers(users);
    setMsg('Akun dibuat. Silakan login.','ok');
    setTimeout(()=>{ switchTab('login'); user.value = u; }, 900);
    return false;
  }

  if (users[u] && users[u] === h){
    sessionStorage.setItem('vanta_user', u);
    sessionStorage.setItem('vanta_token', await hashPass(u + ':' + h + ':vanta'));
    setMsg('Akses diterima. Mengalihkan…','ok');
    setTimeout(()=> location.href = 'panel', 600);
  } else {
    setMsg('Username atau password salah','bad');
  }
  return false;
}
</script>
</body>
</html>
